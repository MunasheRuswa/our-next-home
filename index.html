<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Our next home</title>
<meta name="description" content="Two-bedroom homes to rent in Bloemfontein. Bains first, then cheapest first.">
<meta property="og:title" content="Our next home">
<meta property="og:description" content="Two-bedroom homes to rent in Bloemfontein. Bains first, then everything else from the cheapest up.">
<meta property="og:image" content="https://munasheruswa.github.io/our-next-home/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E2A47">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Portal layout: navy masthead with a search panel, Bains band first, then a cheapest-first grid.
   Listing pages carry a sticky action bar on phones. Every picture is an illustration drawn from its advert. */
:root{
  --bg:#EEF2F6;--card:#FFFFFF;--ink:#0E2A47;--ink2:#33475E;--muted:#5E6E82;--line:#DCE3EB;--line2:#C9D3DE;
  --navy:#0E2A47;--navy2:#173C63;--on-navy:#FFFFFF;--on-navy-2:#B9C8DB;
  --blue:#1D63C9;--blue-ink:#FFFFFF;--blue-soft:#E4EEFB;
  --rose:#D33A6A;--rose-soft:#FBE6EE;
  --gold:#E9A21A;--gold-soft:#FFF5E0;--gold-ink:#7A5200;--gold-line:#F0D08C;
  --green:#13804F;--green-soft:#E0F3E9;--amber:#97590A;--amber-soft:#FFEFD6;--grey-soft:#EDF0F3;
  --shadow:0 1px 2px rgba(14,42,71,.06),0 8px 22px -14px rgba(14,42,71,.3);
  /* illustration world */
  --sky1:#8DBFEF;--sky2:#E6F1FC;--sun:#FFD36B;--cloud:#FFFFFF;--hill:#9FB6AA;--hill2:#BFD1C3;
  --lawn1:#93C26F;--lawn2:#6EA250;--pave1:#DDD7CB;--pave2:#CBC3B4;--street:#8B939B;--curb:#CBD0D5;
  --glass1:#D7EAFB;--glass2:#9CC5EC;--leaf1:#5F9B46;--leaf2:#467E34;--trunk:#7A5A3C;--bud:#E2557F;
  --pool:#58BFEA;--net:#2E6A4F;--post:#9AA3AD;--car:#D7DDE3;--car2:#B9C2CB;--metal:#5B6570;--wood:#B58A5E;--wood2:#9A714A;
  --p0w:#F2EDE4;--p0s:#DCD3C5;--p0t:#FFFFFF;--p0r:#3A4250;--p0d:#6E4B37;
  --p1w:#E7D6B8;--p1s:#CDB894;--p1t:#F8F1E4;--p1r:#8A3E2E;--p1d:#2F4B3B;
  --p2w:#B9673F;--p2s:#9A5332;--p2t:#EEE6DA;--p2r:#474D56;--p2d:#273546;
  --p3w:#D7DADD;--p3s:#BCC2C8;--p3t:#F6F7F8;--p3r:#2E3A48;--p3d:#8A5A3C;
  --p4w:#EDE6D8;--p4s:#D6CCBA;--p4t:#FFFFFF;--p4r:#5D6C7B;--p4d:#A2412F;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0A1522;--card:#111F31;--ink:#E6EDF6;--ink2:#C3D0DF;--muted:#93A4B9;--line:#1F3149;--line2:#2A3F5C;
  --navy:#071423;--navy2:#10294A;--on-navy-2:#9FB3CC;
  --blue:#6FA6FF;--blue-ink:#071423;--blue-soft:#14305A;--rose:#FF7AA1;--rose-soft:#3B1627;
  --gold:#F5BE4B;--gold-soft:#241C0C;--gold-ink:#F5BE4B;--gold-line:#4E3C14;
  --green:#62D29D;--green-soft:#0F2E21;--amber:#F3B45C;--amber-soft:#33240C;--grey-soft:#1A2A3E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.85);
  --sky1:#132340;--sky2:#3E5B86;--sun:#F3E6B3;--cloud:#566D93;--hill:#22354E;--hill2:#2C4362;
  --lawn1:#406C3B;--lawn2:#2F5530;--pave1:#4C5159;--pave2:#3C4148;--street:#2A2F36;--curb:#4B535D;
  --glass1:#FFE7A6;--glass2:#F1BC58;--leaf1:#37643B;--leaf2:#294E2E;--trunk:#5A4430;--bud:#E86A8F;
  --pool:#2C8DB6;--net:#244E3D;--post:#58616C;--car:#7E8792;--car2:#69727D;--metal:#8D96A1;--wood:#7A5B3E;--wood2:#664B32;
  --p0w:#8E8A83;--p0s:#77736C;--p0t:#A9A6A1;--p0r:#262B34;--p0d:#45301F;
  --p1w:#8A7D66;--p1s:#756A55;--p1t:#9E9483;--p1r:#56271D;--p1d:#1E2F25;
  --p2w:#74402A;--p2s:#5E3322;--p2t:#8E887F;--p2r:#2D3137;--p2d:#18212C;
  --p3w:#80838A;--p3s:#6C7077;--p3t:#9A9DA1;--p3r:#1D252E;--p3d:#563826;
  --p4w:#8C8679;--p4s:#777164;--p4t:#A39F96;--p4r:#3A444E;--p4d:#66291E;
  color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);font-feature-settings:"tnum" 1;overflow-x:hidden}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.18;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.ic{display:inline-flex;flex:none}
.ic svg,svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead ---------- */
.masthead{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;color:var(--on-navy);text-decoration:none;font-weight:800;font-size:1.08rem;letter-spacing:-.01em;margin-right:auto}
.logo svg{width:32px;height:32px}
.toptabs{display:none;gap:4px}
.toptabs a{color:var(--on-navy-2);text-decoration:none;font-weight:700;font-size:.95rem;padding:8px 14px;border-radius:999px;display:flex;gap:8px;align-items:center}
.toptabs a[aria-current=page]{background:rgba(255,255,255,.12);color:var(--on-navy)}
.savedbtn{display:flex;align-items:center;gap:8px;color:var(--on-navy);text-decoration:none;font-weight:700;font-size:.92rem;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 14px 7px 11px;min-height:40px}
.savedbtn .ic svg{stroke:var(--rose);width:19px;height:19px}
.savedbtn.has .ic svg{fill:var(--rose)}
@media (min-width:860px){.toptabs{display:flex}.savedbtn{display:none}}
.hero{padding-bottom:58px;position:relative;z-index:1}
.hero h1{font-size:clamp(1.65rem,5.6vw,2.6rem);font-weight:800;max-width:20ch;margin-top:10px}
.hero .sub{color:var(--on-navy-2);margin-top:8px;font-size:1.02rem;max-width:52ch}
.search{margin-top:20px;background:var(--card);color:var(--ink);border-radius:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));box-shadow:0 10px 30px -12px rgba(0,0,0,.45);max-width:760px}
.field{position:relative;display:grid;gap:1px;padding:10px 12px 10px 14px;min-width:0}
.field+.field{border-left:1px solid var(--line)}
.field label{font-size:.76rem;font-weight:700;color:var(--muted)}
.field select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:800;font-size:.98rem;padding:0 20px 0 0;width:100%;min-height:26px;color:var(--ink);text-overflow:ellipsis}
.field .chev{position:absolute;right:10px;bottom:13px;color:var(--muted);pointer-events:none}
.field .chev svg{width:16px;height:16px}
.musts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.must{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--on-navy);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:700;min-height:38px;display:flex;align-items:center;gap:6px}
.must[aria-pressed=true]{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.must[aria-pressed=true] .ic svg{stroke:var(--navy)}
.ridge{position:absolute;left:0;right:0;bottom:-1px;height:56px;color:var(--navy2);pointer-events:none}
.ridge svg{width:100%;height:100%;display:block}
@media (max-width:420px){.field{padding:9px 8px 9px 10px}.field select{font-size:.9rem;padding-right:16px}.field .chev{right:5px}}

/* ---------- layout ---------- */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media (min-width:860px){main{padding-bottom:56px}}
.notice{display:flex;align-items:center;gap:10px;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin-top:18px;font-size:.93rem;font-weight:600}
.notice .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.sec{margin-top:26px}
.sechead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.sechead h2{font-size:1.45rem;font-weight:800}
.sechead p{color:var(--muted);font-size:.95rem;margin-top:2px}
.sort{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);font-weight:600}
.sort select{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 32px 8px 12px;font-weight:700;color:var(--ink);min-height:40px}
.sort .wrapsel{position:relative;display:inline-flex}
.sort .wrapsel .ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.sort .wrapsel .ic svg{width:16px;height:16px}

/* Bains band */
.bains{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:20px;padding:16px;margin-top:-34px;position:relative;z-index:2}
.bains .sechead{margin-bottom:12px}
.bains .sechead h2{display:flex;align-items:center;gap:10px}
.bains .mark{width:30px;height:30px;border-radius:9px;background:var(--gold);display:grid;place-items:center;flex:none}
.bains .mark svg{width:18px;height:18px;stroke:#3A2700}
.bains .sechead p{color:var(--ink2)}
.fgrid{display:grid;gap:14px}

.main-first{margin-top:22px}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto;position:relative;min-width:0}
.card.dim{opacity:.6}
.media{display:block;position:relative;aspect-ratio:16/10;background:var(--sky2);overflow:hidden}
.media svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.badges{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:800;border-radius:7px;padding:3px 8px;line-height:1.35;white-space:nowrap}
.badge.green{background:var(--green);color:#fff}
.badge.amber{background:#FFF1D6;color:#7A4600}
.badge.grey{background:rgba(255,255,255,.92);color:#33475E}
.badge.gold{background:var(--gold);color:#2E1F00}
.badge.goldline{background:rgba(255,255,255,.94);color:#6A4700;box-shadow:inset 0 0 0 1.5px var(--gold)}
.badge.new{background:var(--blue);color:#fff}
.badge .ic svg{width:13px;height:13px;fill:currentColor;stroke:none}
.illus{position:absolute;left:10px;bottom:10px;font-size:.72rem;font-weight:700;color:#fff;background:rgba(10,24,40,.6);border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:5px}
.illus .ic svg{width:13px;height:13px}
.media .cover{position:absolute;inset:0;z-index:1}
.media .badges,.media .illus{z-index:2;pointer-events:none}
.ph-btn{position:absolute;right:10px;bottom:8px;z-index:3;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.96);color:#0E2A47;font-size:.84rem;font-weight:800;border-radius:999px;padding:0 13px 0 11px;min-height:36px;text-decoration:none;box-shadow:0 2px 10px rgba(14,42,71,.28)}
.ph-btn .ic svg{width:17px;height:17px}
img.own{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.heart{z-index:4}
.heart{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 8px rgba(14,42,71,.22)}
.heart svg{width:22px;height:22px;fill:none;stroke:var(--rose);stroke-width:2}
.heart[aria-pressed=true] svg{fill:var(--rose)}
.info{padding:14px 16px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.price{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:2px}
.info h3{font-size:1.04rem;font-weight:700;letter-spacing:-.005em}
.info h3 a{color:var(--ink);text-decoration:none}
.info h3 a:hover{text-decoration:underline}
.loc{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.9rem;min-width:0}
.loc .ic svg{width:16px;height:16px}
.specs{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:.9rem;font-weight:600}
.specs li{display:flex;align-items:center;gap:6px}
.specs .ic svg{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--grey-soft);color:var(--ink2)}
.chip.g{background:var(--green-soft);color:var(--green)}
.bnote{font-size:.86rem;font-weight:700;color:var(--gold-ink);display:flex;gap:6px;align-items:flex-start}
.mine{font-size:.82rem;font-weight:800}
.mine.love{color:var(--green)}.mine.maybe{color:var(--amber)}.mine.no{color:var(--muted)}
.agency{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 12px 10px 16px;min-width:0}
.agmark{width:30px;height:30px;border-radius:8px;background:var(--navy2);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;flex:none;letter-spacing:.02em}
.agname{font-size:.86rem;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.advert{display:inline-flex;align-items:center;gap:5px;font-size:.86rem;font-weight:800;color:var(--blue);text-decoration:none;padding:8px 6px;white-space:nowrap}
.advert .ic svg{width:16px;height:16px}

/* featured card: horizontal on wider screens */
@media (min-width:700px){
  .card.feature{grid-template-columns:minmax(0,46%) minmax(0,1fr);grid-template-rows:1fr auto}
  .card.feature .media{grid-row:1/span 2;aspect-ratio:auto;min-height:250px}
  .card.feature .info{padding:18px 20px 12px}
  .card.feature .price{font-size:1.8rem}
  .card.feature .info h3{font-size:1.15rem}
}

.more{margin-top:18px;background:var(--card);border:1px dashed var(--line2);border-radius:16px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.more p{color:var(--ink2);max-width:52ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid transparent;background:var(--blue);color:var(--blue-ink);font-weight:800;text-decoration:none;text-align:center}
.btn .ic svg{width:18px;height:18px}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.rose{background:var(--rose);color:#fff}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:16px;padding:26px;display:grid;gap:10px;justify-items:start}
.empty b{font-size:1.05rem}
.empty p{color:var(--muted)}

/* ---------- listing page ---------- */
.crumbs{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);padding-top:16px;flex-wrap:wrap}
.crumbs a{color:var(--blue);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:40px}
.crumbs .ic svg{width:16px;height:16px}
.gallery{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--sky2);margin-top:6px;box-shadow:var(--shadow)}
@media (min-width:600px){.gallery{aspect-ratio:16/9}}@media (min-width:980px){.gallery{aspect-ratio:21/9}}
.gallery svg.art{position:absolute;inset:0;width:100%;height:100%}
.gallery .over{position:absolute;left:12px;bottom:12px;z-index:3}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start;border:0;padding:0;margin:0;background:var(--sky2)}
button.slide{cursor:zoom-in}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gallery .badges,.gallery .cap{z-index:2;pointer-events:none}
.gallery .cap.count{top:auto;bottom:18px;right:12px;font-size:.84rem;padding:4px 11px;border-radius:999px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.thumbs button{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--grey-soft);cursor:zoom-in}
.thumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.row2 .btn{flex:1 1 160px;cursor:pointer}
.row2 label:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.panel .hint{color:var(--muted);font-size:.94rem}
.lb{position:fixed;inset:0;z-index:80;background:rgba(4,10,18,.96);color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr);padding:calc(10px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.lbbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;padding-bottom:10px}
.lbact{display:flex;gap:8px}
.lb button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;min-width:44px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800}
.lb button.warn{background:#C53030}
.lb .ic svg{width:20px;height:20px}
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.stage img{max-width:100%;max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);object-fit:contain;display:block;border-radius:6px}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%)}
.stage .prev{left:4px}.stage .next{right:4px}
.gallery .cap{position:absolute;right:12px;top:12px;font-size:.74rem;font-weight:700;color:#fff;background:rgba(10,24,40,.55);border-radius:7px;padding:2px 8px}
.gallery .photos{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0E2A47;font-weight:800;font-size:.92rem;border-radius:999px;padding:9px 16px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25);min-height:44px}
.gallery .photos .ic svg{width:17px;height:17px}
.gallery .badges{top:12px;left:12px}
.dgrid{display:grid;gap:18px;margin-top:18px}
@media (min-width:980px){.dgrid{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}.dside{position:sticky;top:16px}}
.dhead{display:grid;gap:8px}
.dhead .price{font-size:2.1rem}
.dhead h1{font-size:clamp(1.4rem,4.6vw,1.9rem);font-weight:800}
.dhead .specs{font-size:.98rem;gap:8px 18px;margin-top:6px}
.dhead .specs .ic svg{width:20px;height:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:1.12rem;font-weight:800}
.ov{display:grid;grid-template-columns:auto 1fr;margin:0}
.ov dt,.ov dd{padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.ov dt{color:var(--muted);padding-right:16px}
.ov dd{margin:0;text-align:right;font-weight:700;color:var(--ink)}
.ov dt:first-of-type,.ov dt:first-of-type+dd{border-top:0}
.ticks,.asks{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ticks li,.asks li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.95rem;color:var(--ink2)}
.ticks .ic svg{color:var(--green);width:20px;height:20px;stroke-width:2.2}
.asks .ic svg{color:var(--amber);width:20px;height:20px}
.areanote{background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.93rem;font-weight:600}
.react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.react button{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:800;font-size:.92rem;min-height:48px}
.react button[aria-pressed=true][data-v=love]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.react button[aria-pressed=true][data-v=maybe]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.react button[aria-pressed=true][data-v=no]{background:var(--grey-soft);border-color:var(--muted);color:var(--ink2)}
textarea{width:100%;min-height:96px;border:1px solid var(--line2);background:var(--bg);border-radius:12px;padding:12px;resize:vertical;font-size:.95rem}
.agent{display:flex;align-items:center;gap:12px}
.agent .agmark{width:44px;height:44px;border-radius:12px;font-size:.9rem}
.agent b{display:block}
.agent span{color:var(--muted);font-size:.9rem}
.stack{display:grid;gap:8px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.actionbar .save{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:0 16px;min-height:48px;font-weight:800}
.actionbar .save svg{width:20px;height:20px;fill:none;stroke:var(--rose);stroke-width:2}
.actionbar .save[aria-pressed=true] svg{fill:var(--rose)}
@media (min-width:980px){.actionbar{display:none}}

/* ---------- saved & plan ---------- */
.pagehead{padding-top:22px;display:grid;gap:6px}
.pagehead h1{font-size:clamp(1.5rem,5vw,2rem);font-weight:800}
.pagehead p{color:var(--muted)}
.rows{display:grid;gap:10px;margin-top:16px}
.srow{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;text-decoration:none;color:var(--ink);min-width:0}
.srow .thumb{position:relative;width:104px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--sky2)}
.srow .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.srow b{font-size:.98rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow span{font-size:.86rem;color:var(--muted)}
.srow .price{font-size:1.1rem}
.srow>div{min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
.cmp th,.cmp td{padding:11px 14px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{border-top:0;font-size:.95rem;font-weight:800}
.cmp tbody th{color:var(--muted);font-weight:700;position:sticky;left:0;background:var(--card);white-space:nowrap}
.plan{display:grid;gap:18px;margin-top:18px}
@media (min-width:860px){.plan{grid-template-columns:repeat(3,1fr);align-items:start}}
.plan h2{font-size:1.1rem;font-weight:800;margin-bottom:10px}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:.95rem}
.plan input{width:22px;height:22px;margin:0;accent-color:var(--green);flex:none}
.plan input:checked+span{color:var(--muted);text-decoration:line-through}

/* ---------- bottom tabs (phones) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;max-width:140px;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:.75rem;font-weight:700;color:var(--muted);text-decoration:none;position:relative;min-height:52px}
.tabbar a .ic svg{width:22px;height:22px}
.tabbar a[aria-current=page]{color:var(--blue)}
.tabbar .ct{position:absolute;top:2px;left:calc(50% + 6px);background:var(--rose);color:#fff;border-radius:999px;font-size:.66rem;padding:0 6px;line-height:1.55;font-weight:800}
@media (min-width:860px){.tabbar{display:none}}
.toptabs .ct{background:var(--rose);color:#fff;border-radius:999px;font-size:.7rem;padding:0 7px;line-height:1.6}

footer.foot{margin-top:34px;color:var(--muted);font-size:.84rem;max-width:70ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:.92rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:860px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.page-enter{animation:enter .22s ease-out both}@keyframes enter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (min-width:1000px){.fgrid.two{grid-template-columns:1fr 1fr}.fgrid.two .card.feature{grid-template-columns:none;grid-template-rows:auto 1fr auto}.fgrid.two .card.feature .media{grid-row:auto;aspect-ratio:16/9;min-height:0}}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap topbar">
    <a class="logo" href="#homes" aria-label="Our next home, all homes">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FFFFFF"/><path d="M7 15.5L16 8l9 7.5V25H7z" fill="#0E2A47"/><path d="M16 22.6s-4-2.5-4-5.6a2.3 2.3 0 0 1 4-1.5 2.3 2.3 0 0 1 4 1.5c0 3.1-4 5.6-4 5.6z" fill="#D33A6A"/></svg>
      <span>Our next home</span>
    </a>
    <nav class="toptabs" aria-label="Sections">
      <a href="#homes" data-nav="homes">Homes</a>
      <a href="#saved" data-nav="saved">Saved <span class="ct" data-count hidden></span></a>
      <a href="#plan" data-nav="plan">Plan</a>
    </nav>
    <a class="savedbtn" href="#saved" id="savedbtn"><span class="ic" data-i="heart"></span><span id="savedlbl">Saved</span></a>
  </div>
  <div class="wrap hero" id="hero">
    <h1>Two-bedroom homes to rent in Bloemfontein</h1>
    <p class="sub">Bains first, then every other home from the cheapest up.</p>
    <form class="search" role="search" aria-label="Filter homes" onsubmit="return false">
      <div class="field"><label for="f-area">Area</label><select id="f-area" data-f="area"></select><span class="chev ic" data-i="down"></span></div>
      <div class="field"><label for="f-max">Max rent</label><select id="f-max" data-f="max"></select><span class="chev ic" data-i="down"></span></div>
      <div class="field"><label for="f-when">Move in</label><select id="f-when" data-f="when"><option value="dec">1 Dec</option><option value="any">Any date</option></select><span class="chev ic" data-i="down"></span></div>
    </form>
    <div class="musts" role="group" aria-label="Must have">
      <button type="button" class="must" data-must="garden" aria-pressed="false">Garden</button>
      <button type="button" class="must" data-must="parking" aria-pressed="false">Garage or carport</button>
      <button type="button" class="must" data-must="house" aria-pressed="false">Townhouse or duet</button>
    </div>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <a href="#homes" data-nav="homes"><span class="ic" data-i="home"></span>Homes</a>
  <a href="#saved" data-nav="saved"><span class="ic" data-i="heart"></span>Saved<span class="ct" data-count hidden></span></a>
  <a href="#plan" data-nav="plan"><span class="ic" data-i="list"></span>Plan</a>
</nav>
<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Your photos"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
"use strict";
const SITE = "https://munasheruswa.github.io/our-next-home/";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const R = n => n == null ? "" : "R " + Number(n).toLocaleString("en-ZA").replace(/[\s,. ]/g, " ");
const MS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ML = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pd = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fd = (s, long) => { const d = pd(s); return d ? `${d.getDate()} ${(long ? ML : MS)[d.getMonth()]}${long ? " " + d.getFullYear() : ""}` : ""; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("onh:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("onh:" + k, JSON.stringify(v)); } catch {} }
};
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- icons ---------- */
const I = {
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  home: '<path d="M3.5 11L12 4l8.5 7v9a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  bed: '<path d="M3 18v-6.5A2.5 2.5 0 0 1 5.5 9h13a2.5 2.5 0 0 1 2.5 2.5V18M3 14.5h18M3 18v2M21 18v2M6.5 9V7a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 12.5 7v2"/>',
  bath: '<path d="M4 12h16v2.5A4.5 4.5 0 0 1 15.5 19h-7A4.5 4.5 0 0 1 4 14.5zM6.5 12V6.2A2.2 2.2 0 0 1 10.3 5M7.5 19l-1 2M16.5 19l1 2"/>',
  car: '<path d="M5 16.5V12l1.8-4.2A1.5 1.5 0 0 1 8.2 7h7.6a1.5 1.5 0 0 1 1.4.8L19 12v4.5M4 12h16M5 16.5h14M7 16.5V19M17 16.5V19"/><circle cx="8.2" cy="14" r=".8"/><circle cx="15.8" cy="14" r=".8"/>',
  size: '<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/>',
  pin: '<path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/>',
  ext: '<path d="M14 5h5v5M19 5l-8.5 8.5M18 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1H10"/>',
  check: '<path d="M5 12.5l4.2 4.2L19 7"/>',
  ask: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8M12 17h.01"/>',
  copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>',
  send: '<path d="M21 3L10.5 13.5M21 3l-6.8 18-3.7-7.5L3 9.8z"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  camera: '<path d="M4 8h3l1.6-2.4A1.5 1.5 0 0 1 9.8 5h4.4a1.5 1.5 0 0 1 1.2.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  share: '<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic = n => `<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg></span>`;
$$("[data-i]").forEach(el => el.outerHTML = ic(el.dataset.i).replace('class="ic"', `class="${el.className}"`));

/* ---------- illustration: each home drawn from what its advert says ---------- */
let ART = 0;
function art(h) {
  const d = h.draw || {}, n = ++ART, p = "p" + (d.palette || 0);
  const W = `var(--${p}w)`, S = `var(--${p}s)`, T = `var(--${p}t)`, RF = `var(--${p}r)`, D = `var(--${p}d)`;
  const F = c => `style="fill:${c}"`, ST = (c, w) => `style="fill:none;stroke:${c};stroke-width:${w}"`;
  const B = 204;
  let mass = "", glass = "", fore = "", zoneL = false, zoneR = false;
  const win = (x, y, w, hh) => { glass += `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="1.5" style="fill:url(#gl${n});stroke:${T};stroke-width:2.2"/><path d="M${x + w / 2} ${y + 1}v${hh - 2}M${x + 1} ${y + hh * .52}h${w - 2}" ${ST(T, 1.4)}/>`; };
  const door = (x, y, w, hh) => { mass += `<rect x="${x}" y="${y}" width="${w}" height="${hh}" ${F(D)}/><rect x="${x}" y="${y}" width="${w}" height="${hh}" ${ST(T, 1.6)}/><circle cx="${x + w - 4}" cy="${y + hh * .55}" r="1.3" ${F(T)}/>`; };
  let cx = 200, x1 = 100, x2 = 300;
  // building
  if (d.form === "apartment") {
    const x0 = 128, w = 150, fh = 34, fl = 3, top = B - fh * fl; cx = x0 + w / 2; x1 = x0; x2 = x0 + w;
    mass += `<ellipse cx="${cx}" cy="${B + 2}" rx="${w / 2 + 14}" ry="5" style="fill:#000;opacity:.12"/>`;
    mass += `<rect x="${x0}" y="${top}" width="${w}" height="${fh * fl}" ${F(W)}/><rect x="${x0 + w - 16}" y="${top}" width="16" height="${fh * fl}" ${F(S)}/>`;
    mass += `<rect x="${x0 - 5}" y="${top - 9}" width="${w + 10}" height="11" rx="1" ${F(RF)}/>`;
    for (let f = 0; f < fl; f++) {
      const y = B - (f + 1) * fh;
      if (f > 0) mass += `<rect x="${x0}" y="${y + fh - 2}" width="${w}" height="2" ${F(S)}/>`;
      const xs = f === 0 ? [x0 + 12, x0 + w - 44] : [x0 + 12, x0 + 44, x0 + 84, x0 + w - 44];
      xs.forEach(x => win(x, y + 8, 20, 15));
      if (f > 0) [x0 + 40, x0 + 80].forEach(bx => {
        const by = y + fh - 4;
        fore += `<rect x="${bx}" y="${by}" width="32" height="3" ${F(S)}/><path d="M${bx} ${by}v-7h32v7M${bx + 8} ${by - 7}v7M${bx + 16} ${by - 7}v7M${bx + 24} ${by - 7}v7" ${ST(T, 1.5)}/>`;
        if (d.balcony && f === 1) fore += `<circle cx="${bx + 5}" cy="${by - 10}" r="4" ${F("var(--leaf1)")}/><circle cx="${bx + 27}" cy="${by - 9}" r="3.4" ${F("var(--leaf2)")}/>`;
      });
    }
    door(cx - 9, B - 26, 18, 26);
    mass += `<rect x="${cx - 15}" y="${B - 31}" width="30" height="5" ${F(RF)}/>`;
  } else if (d.form === "duet") {
    const x0 = 108, w = 188, top = B - 60; cx = x0 + 71; x1 = x0; x2 = x0 + w;
    mass += `<ellipse cx="${x0 + w / 2}" cy="${B + 2}" rx="${w / 2 + 14}" ry="5" style="fill:#000;opacity:.12"/>`;
    mass += `<rect x="${x0}" y="${top}" width="${w}" height="60" ${F(W)}/><rect x="${x0 + w / 2 - 1.5}" y="${top}" width="3" height="60" ${F(S)}/>`;
    mass += `<polygon points="${x0 - 10},${top + 2} ${x0 + 34},${top - 28} ${x0 + w - 34},${top - 28} ${x0 + w + 10},${top + 2}" ${F(RF)}/><path d="M${x0 + 34} ${top - 28}H${x0 + w - 34}" ${ST(T, 1.2)} opacity=".35"/>`;
    win(x0 + 14, top + 16, 28, 20); win(x0 + w - 42, top + 16, 28, 20);
    door(x0 + 62, B - 32, 18, 32); door(x0 + w - 80, B - 32, 18, 32);
    mass += `<rect x="${x0 + 56}" y="${B - 37}" width="30" height="5" ${F(RF)}/><rect x="${x0 + w - 86}" y="${B - 37}" width="30" height="5" ${F(RF)}/>`;
  } else if (d.form === "house") {
    const x0 = 96, w = 208, top = B - 56; cx = x0 + 40; x1 = x0; x2 = x0 + w;
    mass += `<ellipse cx="${x0 + w / 2}" cy="${B + 2}" rx="${w / 2 + 16}" ry="5" style="fill:#000;opacity:.12"/>`;
    mass += `<rect x="${x0}" y="${top}" width="${w}" height="56" ${F(W)}/><rect x="${x0}" y="${top}" width="${w}" height="7" ${F(S)} opacity=".6"/>`;
    mass += `<polygon points="${x0 - 12},${top + 2} ${x0 + 44},${top - 30} ${x0 + w - 44},${top - 30} ${x0 + w + 12},${top + 2}" ${F(RF)}/>`;
    win(x0 + 98, top + 16, 30, 20); win(x0 + 150, top + 16, 30, 20);
    door(x0 + 31, B - 32, 18, 32);
    [x0 + 8, x0 + 70].forEach(px => fore += `<rect x="${px}" y="${top + 4}" width="5" height="${B - top - 4}" ${F(T)}/>`);
  } else {
    const a = 104, wa = 100, b = 200, wb = 104, top = B - 64; cx = a + 72; x1 = a; x2 = b + wb;
    mass += `<ellipse cx="${(a + b + wb) / 2}" cy="${B + 2}" rx="${(b + wb - a) / 2 + 14}" ry="5" style="fill:#000;opacity:.12"/>`;
    mass += `<rect x="${b}" y="${top + 4}" width="${wb}" height="60" ${F(S)}/><polygon points="${b - 6},${top + 6} ${b + wb / 2},${top - 26} ${b + wb + 8},${top + 6}" ${F(RF)} opacity=".88"/>`;
    mass += `<rect x="${a}" y="${top}" width="${wa}" height="64" ${F(W)}/><polygon points="${a - 8},${top + 2} ${a + wa / 2},${top - 34} ${a + wa + 8},${top + 2}" ${F(RF)}/>`;
    mass += `<rect x="${a + wa / 2 - 5}" y="${top - 16}" width="10" height="7" rx="1" ${F(T)}/><rect x="${b + wb / 2 - 5}" y="${top - 10}" width="10" height="7" rx="1" ${F(T)} opacity=".9"/>`;
    win(a + 14, top + 16, 28, 21); win(b + 62, top + 18, 28, 21);
    door(a + 62, B - 34, 20, 34);
    if (!d.garage) door(b + 18, B - 32, 18, 32);
  }
  // garage, attached for houses, separate block for flats
  if (d.garage) {
    const gx = d.form === "apartment" ? 300 : x2 - 2, gw = 56, gh = 44;
    mass += `<rect x="${gx}" y="${B - gh}" width="${gw}" height="${gh}" ${F(S)}/><rect x="${gx - 3}" y="${B - gh - 5}" width="${gw + 6}" height="6" ${F(RF)}/>`;
    mass += `<rect x="${gx + 7}" y="${B - 35}" width="${gw - 14}" height="35" ${F(T)}/><path d="M${gx + 7} ${B - 28}h${gw - 14}M${gx + 7} ${B - 21}h${gw - 14}M${gx + 7} ${B - 14}h${gw - 14}M${gx + 7} ${B - 7}h${gw - 14}" ${ST(S, 1.2)}/>`;
    zoneR = true;
  }
  // wendy house
  let wendy = "";

/* ---------- your own photos: shrunk on the phone and kept in its browser storage, never uploaded ---------- */
const PH = {
  db: null, cache: new Map(),
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let r; try { r = indexedDB.open("onh-photos", 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { const st = r.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true }); st.createIndex("home", "home"); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async loadAll() {
    try {
      const db = await this.open();
      const rows = await new Promise((res, rej) => { const q = db.transaction("photos").objectStore("photos").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
      rows.sort((a, b) => a.added - b.added).forEach(r => this.keep(r.home, r.id, new Blob([r.buf], { type: r.type || "image/jpeg" })));
    } catch {}
  },
  keep(home, id, blob) { if (!this.cache.has(home)) this.cache.set(home, []); this.cache.get(home).push({ id, blob, url: URL.createObjectURL(blob) }); },
  list(home) { return this.cache.get(home) || []; },
  async add(home, files) {
    try { await this.open(); } catch { toast("Photos can't be saved in this browser. Open the link in Chrome or Safari."); return 0; }
    let n = 0, failed = 0;
    for (const f of files) {
      try {
        const { blob, w, h } = await shrink(f);
        const buf = await new Response(blob).arrayBuffer();
        const id = await new Promise((res, rej) => {
          const tx = this.db.transaction("photos", "readwrite"); let key;
          const q = tx.objectStore("photos").add({ home, type: "image/jpeg", buf, w, h, added: Date.now() });
          q.onsuccess = () => key = q.result; tx.oncomplete = () => res(key); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
        });
        this.keep(home, id, new Blob([buf], { type: "image/jpeg" })); n++;
      } catch { failed++; }
    }
    if (failed) toast(failed === files.length ? "That photo couldn't be added. Try a JPEG or a screenshot." : `${failed} of the photos couldn't be added.`);
    if (n && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    return n;
  },
  async remove(home, id) {
    await this.open();
    await new Promise((res, rej) => { const tx = this.db.transaction("photos", "readwrite"); tx.objectStore("photos").delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    const list = this.list(home), i = list.findIndex(p => p.id === id);
    if (i >= 0) { URL.revokeObjectURL(list[i].url); list.splice(i, 1); }
  }
};
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = src; await img.decode();
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", .82));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(src); }
}

      ${h.facts.length ? `<section class="panel" aria-labelledby="fa-h"><h2 id="fa-h">What the advert says</h2><ul class="ticks">${h.facts.map(x => `<li>${ic("check")}<span>${esc(x)}</span></li>`).join("")}</ul></section>` : ""}
      <section class="panel" aria-labelledby="as-h"><h2 id="as-h">Ask the agent</h2><ul class="asks">${asks.map(x => `<li>${ic("ask")}<span>${esc(x)}</span></li>`).join("")}</ul>
        <button type="button" class="btn ghost" data-act="copymsg">${ic("copy")}Copy a message for the agent</button></section>
    </div>
    <aside class="dside stack" style="gap:16px">
      <section class="panel" aria-labelledby="yt-h"><h2 id="yt-h">Your take</h2>
        <div class="react" role="group" aria-label="Your take on this home">${["love", "maybe", "no"].map(v => `<button type="button" data-v="${v}" aria-pressed="${m.v === v}">${VL[v]}</button>`).join("")}</div>
        <label for="note" class="sr">Your notes</label><textarea id="note" placeholder="What stood out? What worried you?">${esc(m.note || "")}</textarea>
        <button type="button" class="btn ${m.heart ? "ghost" : "rose"}" data-act="save">${m.heart ? "Saved. Tap to remove" : "Save this home"}</button>
      </section>
      <section class="panel" aria-labelledby="ag-h"><h2 id="ag-h">Listed by</h2>
        <div class="agent"><span class="agmark" aria-hidden="true">${esc(initials(h.agency || h.source))}</span><div><b>${esc(h.agency || h.source || "")}</b>${h.agent ? `<span>${esc(h.agent)}</span>` : ""}</div></div>
        <a class="btn" href="${esc(h.url)}" target="_blank" rel="noopener">Contact on ${esc(h.source || "the advert")}${ic("ext")}</a>
      </section>
    </aside>
  </div>
  <div class="actionbar">
    <button type="button" class="save" data-act="save" aria-pressed="${!!m.heart}"><svg viewBox="0 0 24 24" aria-hidden="true">${I.heart}</svg>${m.heart ? "Saved" : "Save"}</button>
    <a class="btn" href="${esc(h.url)}" target="_blank" rel="noopener">View advert${ic("ext")}</a>
  </div>` + foot();
}
function viewSaved() {
  const ps = saved().sort((a, b) => (b.bains ? 1 : 0) - (a.bains ? 1 : 0) || a.rent - b.rent);
  if (!ps.length) return `<div class="pagehead"><h1>Saved homes</h1></div><div class="empty" style="margin-top:16px"><b>Nothing saved yet.</b><p>Tap the heart on any home to keep it here, then send your picks in one go.</p><a class="btn" href="#homes">Browse homes</a></div>` + foot();
  const rows = [["Rent", h => R(h.rent)], ["Area", h => esc(h.suburb)], ["Type", h => esc(h.type || "")], ["Size", h => h.size ? `${h.size} m²` : "Not stated"],
    ["Parking", h => esc(h.parking || "Not stated")], ["Outdoor", h => esc(h.outdoor || "Not stated")], ["Move in", h => esc(timing(h).short)],
    ["Your take", h => esc(VL[mine(h.id).v] || "")], ["Notes", h => esc(mine(h.id).note || "")]];
  return `<div class="pagehead"><h1>Saved homes</h1><p>${ps.length} saved. Your hearts and notes stay on this phone until you send them.</p></div>
    <div style="margin-top:14px"><button type="button" class="btn rose" data-act="send">${ic("send")}Send my picks</button></div>
    <div class="rows">${ps.map(h => `<a class="srow" href="#home/${esc(h.id)}"><span class="thumb">${pic(h)}</span><div><b>${esc(h.title)}</b><span>${esc(h.suburb)}${mine(h.id).v ? `, ${VL[mine(h.id).v].toLowerCase()}` : ""}</span></div><span class="price">${R(h.rent)}</span></a>`).join("")}</div>
    ${ps.length > 1 ? `<section class="sec"><div class="sechead"><div><h2>Side by side</h2><p>Swipe the table sideways on a phone.</p></div></div><div class="tw"><table class="cmp"><thead><tr><th scope="col"><span class="sr">Detail</span></th>${ps.map(h => `<th scope="col">${esc(h.title)}</th>`).join("")}</tr></thead><tbody>${rows.map(([k, f]) => `<tr><th scope="row">${k}</th>${ps.map(h => `<td>${f(h)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>` : ""}
    ${foot()}`;
}
const PLAN = [
  ["This week", [["view", "Save the homes you like and send your picks"], ["book", "Book viewings for the top three"], ["docs", "Get IDs, three payslips and three months' bank statements ready"]]],
  ["At each viewing", [["kids", "Ask whether children are welcome"], ["date", "Ask whether rent can start on 1 December"], ["garden", "Check whether the garden is private and fenced"], ["safe", "Check the gate, the walls and who holds keys"], ["costs", "Ask about the deposit, admin fee, water and electricity"]]],
  ["Before signing", [["lease", "The lease says 1 December for moving in and for rent"], ["dep", "The deposit amount and refund terms are in writing"], ["photos", "Plan to photograph every room on moving day"]]]
];
function viewPlan() {
  const done = store.get("plan", {});
  return `<div class="pagehead"><h1>The plan</h1><p>Tick things off as you go. Ticks are saved on this phone.</p></div>
    <div class="plan">${PLAN.map(([t, items]) => `<section><h2>${t}</h2><ul>${items.map(([k, x]) => `<li><label><input type="checkbox" data-plan="${k}" ${done[k] ? "checked" : ""}><span>${x}</span></label></li>`).join("")}</ul></section>`).join("")}</div>${foot()}`;
}
const foot = () => `<footer class="foot"><p>Adverts checked ${esc(S.checked)}. Rent, dates and availability are set by the agents and can change. Pictures are drawings based on each advert unless you've added your own; tap Photos on any home to see the agent's real photos.</p></footer>`;

/* ---------- render ---------- */
function syncControls() {
  $("#f-area").value = S.f.area; $("#f-max").value = String(S.f.max); $("#f-when").value = S.f.when;
  $$(".must").forEach(b => b.setAttribute("aria-pressed", String(!!S.f[b.dataset.must])));
}
function render() {
  const r = S.route, main = $("#main");
  const hero = r.name === "homes";
  $("#hero").hidden = !hero;
  $("#tabbar").hidden = r.name === "detail";
  main.innerHTML = r.name === "detail" ? viewDetail(r.id) : r.name === "saved" ? viewSaved() : r.name === "plan" ? viewPlan() : viewHomes();
  main.classList.remove("page-enter"); void main.offsetWidth; if (r.name !== "homes") main.classList.add("page-enter");
  $$("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav === (r.name === "detail" ? "homes" : r.name) ? "page" : "false"));
  const n = saved().length;
  $$("[data-count]").forEach(c => { c.hidden = !n; c.textContent = n; });
  $("#savedlbl").textContent = n ? `Saved ${n}` : "Saved";
  $("#savedbtn").classList.toggle("has", n > 0);
  document.title = r.name === "detail" && S.byId.get(r.id) ? `${S.byId.get(r.id).title}, ${R(S.byId.get(r.id).rent)} | Our next home` : "Our next home";
  const slides = $("#slides");
  if (slides) {
    const n2 = PH.list(r.id).length;
    slides.addEventListener("scroll", () => {
      const i = Math.round(slides.scrollLeft / Math.max(1, slides.clientWidth)), cap = $("#slidecap");
      if (cap) cap.textContent = i < n2 ? `${i + 1} / ${n2}` : "Drawing";
    }, { passive: true });
  }
}
function route() {
  const hsh = location.hash.replace(/^#/, "");
  const prev = S.route.name;
  if (prev === "homes") S.homesScroll = scrollY;
  if (hsh.startsWith("home/")) S.route = { name: "detail", id: decodeURIComponent(hsh.slice(5)) };
  else if (hsh === "saved" || hsh === "plan") S.route = { name: hsh };
  else S.route = { name: "homes" };
  if (S.lb) { S.lb = null; drawLb(); }
  render();
  if (S.route.name === "homes" && prev !== "homes") requestAnimationFrame(() => scrollTo(0, S.homesScroll));
  else if (S.route.name !== "homes") scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* ---------- sharing ---------- */
function picksText() {
  const ps = saved().sort((a, b) => (b.bains ? 1 : 0) - (a.bains ? 1 : 0) || a.rent - b.rent);
  return `My picks for our next home:\n\n${ps.map(h => { const m = mine(h.id); return `${m.v === "maybe" ? "🤔" : "❤️"} ${h.title}, ${h.suburb}: ${R(h.rent).replace(/ /g, " ")} a month${m.note ? `\n"${m.note.trim()}"` : ""}\n${h.url}`; }).join("\n\n")}\n\nAll the homes: ${SITE}`;
}
function agentText(h) {
  const first = h.agent ? " " + h.agent.split(/\s+/)[0] : "";
  return `Hi${first}, I'm interested in the 2-bedroom at ${R(h.rent).replace(/ /g, " ")} a month${h.ref ? ` (${h.source || "advert"} ref ${h.ref})` : ""}. We're a small family, two adults and a young child, moving on 1 December. Is it still available from then, and could we view it this week? We can apply the same day with IDs, payslips and bank statements ready.`;
}
async function copy(text, ok) {
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast(ok); } catch { toast("Couldn't copy. Select the text and copy it."); } ta.remove(); }
}
async function sharePhotos(h, only) {
  const ps = only ? [only] : PH.list(h.id);
  const slug = h.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const files = ps.map((p, i) => new File([p.blob], `${slug}-${i + 1}.jpg`, { type: "image/jpeg" }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files, title: h.title, text: `${h.title}, ${R(h.rent).replace(/ /g, " ")} a month\n${h.url}` }); }
    catch (e) { if (!e || e.name !== "AbortError") toast("Couldn't share all of them. Try one photo at a time."); }
  } else toast("This browser can't share photos. Press and hold a photo to save it instead.");
}

/* ---------- full-screen photo viewer ---------- */
function drawLb() {
  const lb = $("#lb");
  const ps = S.lb ? PH.list(S.lb.id) : [];
  if (!S.lb || !ps.length) { S.lb = null; lb.hidden = true; lb.innerHTML = ""; document.body.style.overflow = ""; return; }
  S.lb.i = (S.lb.i + ps.length) % ps.length;
  const p = ps[S.lb.i];
  lb.innerHTML = `<div class="lbbar"><span>Photo ${S.lb.i + 1} of ${ps.length}</span><div class="lbact">
      <button type="button" data-lbact="share">${ic("share")}<span class="sr">Share this photo</span></button>
      <button type="button" data-lbact="del" class="${S.lb.del ? "warn" : ""}">${ic("trash")}${S.lb.del ? "Delete?" : `<span class="sr">Delete this photo</span>`}</button>
      <button type="button" data-lbact="close">${ic("close")}<span class="sr">Close</span></button></div></div>
    <div class="stage"><img src="${p.url}" alt="Your photo ${S.lb.i + 1} of ${ps.length}">
      ${ps.length > 1 ? `<button type="button" class="nav prev" data-lbact="prev">${ic("back")}<span class="sr">Previous photo</span></button><button type="button" class="nav next" data-lbact="next">${ic("chev")}<span class="sr">Next photo</span></button>` : ""}</div>`;
  lb.hidden = false; document.body.style.overflow = "hidden";
}
async function lbAction(a) {
  if (!S.lb) return;
  const h = S.byId.get(S.lb.id), ps = PH.list(S.lb.id), p = ps[S.lb.i];
  if (a === "close") { S.lb = null; drawLb(); return; }
  if (a === "prev" || a === "next") { S.lb.i += a === "next" ? 1 : -1; S.lb.del = false; drawLb(); return; }
  if (a === "share" && h && p) { sharePhotos(h, p); return; }
  if (a === "del" && p) {
    if (!S.lb.del) { S.lb.del = true; drawLb(); return; }
    try { await PH.remove(S.lb.id, p.id); toast("Photo deleted"); } catch { toast("Couldn't delete that photo. Try again."); }
    S.lb.del = false; render(); drawLb();
  }
}

async function send() {
  const text = picksText();
  if (navigator.share) { try { await navigator.share({ title: "My picks", text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  const url = "https://wa.me/?text=" + encodeURIComponent(text);
  if (!window.open(url, "_blank", "noopener")) location.href = url;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) return;
  if (t.dataset.lbact) { lbAction(t.dataset.lbact); return; }
  if (t.dataset.lb != null && S.route.name === "detail") { S.lb = { id: S.route.id, i: Number(t.dataset.lb), del: false }; drawLb(); return; }
  if (t.dataset.heart) {
    const id = t.dataset.heart, on = !mine(id).heart; setMe(id, { heart: on });
    t.setAttribute("aria-pressed", String(on)); const n = saved().length;
    $$("[data-count]").forEach(c => { c.hidden = !n; c.textContent = n; }); $("#savedlbl").textContent = n ? `Saved ${n}` : "Saved"; $("#savedbtn").classList.toggle("has", n > 0);
    toast(on ? "Saved" : "Removed from saved"); return;
  }
  if (t.dataset.must) { S.f[t.dataset.must] = !S.f[t.dataset.must]; store.set("filters2", S.f); syncControls(); render(); return; }
  if (t.dataset.v && S.route.name === "detail") {
    const id = S.route.id, v = mine(id).v === t.dataset.v ? null : t.dataset.v;
    setMe(id, { v, heart: v === "love" ? true : v === "no" ? false : mine(id).heart }); keepNote(); render(); return;
  }
  const a = t.dataset.act;
  if (a === "save" && S.route.name === "detail") { const id = S.route.id, on = !mine(id).heart; setMe(id, { heart: on }); keepNote(); render(); toast(on ? "Saved" : "Removed from saved"); }
  else if (a === "send") send();
  else if (a === "copymsg") { const h = S.byId.get(S.route.id); if (h) copy(agentText(h), "Message copied. Paste it to the agent."); }
  else if (a === "sharephotos") { const h = S.byId.get(S.route.id); if (h) sharePhotos(h); }
  else if (a === "anydate") { S.f.when = "any"; store.set("filters2", S.f); syncControls(); render(); }
  else if (a === "reset") { Object.assign(S.f, { area: "all", max: 0, garden: false, parking: false, house: false }); store.set("filters2", S.f); syncControls(); render(); }
});
function keepNote() { const ta = $("#note"); if (ta && S.route.name === "detail") setMe(S.route.id, { note: ta.value }); }
document.addEventListener("input", e => { if (e.target.id === "note" && S.route.name === "detail") setMe(S.route.id, { note: e.target.value }); });
document.addEventListener("change", async e => {
  if (e.target.id === "addph" && S.route.name === "detail") {
    const files = [...(e.target.files || [])], id = S.route.id; e.target.value = "";
    if (!files.length) return;
    keepNote(); toast(files.length > 1 ? `Adding ${files.length} photos` : "Adding your photo");
    const n = await PH.add(id, files);
    if (n) { if (S.route.name === "detail" && S.route.id === id) render(); toast(n === 1 ? "Photo added" : `${n} photos added`); }
    return;
  }
  const k = e.target.dataset.f;
  if (k) { S.f[k] = k === "max" ? Number(e.target.value) : e.target.value; store.set("filters2", S.f); render(); return; }
  const p = e.target.dataset.plan; if (p) { const d = store.get("plan", {}); d[p] = e.target.checked; store.set("plan", d); }
});

/* ---------- load ---------- */
document.addEventListener("keydown", e => {
  if (!S.lb) return;
  if (e.key === "Escape") lbAction("close"); else if (e.key === "ArrowRight") lbAction("next"); else if (e.key === "ArrowLeft") lbAction("prev");
});
let touchX = null;
$("#lb").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
$("#lb").addEventListener("touchend", e => {
  if (touchX == null || !S.lb) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50 && PH.list(S.lb.id).length > 1) lbAction(dx < 0 ? "next" : "prev");
});

Promise.all([fetch("listings.json", { cache: "no-cache" }).then(r => r.json()), PH.loadAll()]).then(([d]) => {
  S.homes = d.homes; S.checked = d.checked; S.homes.forEach(h => S.byId.set(h.id, h));
  const areas = [...new Set(S.homes.filter(h => !h.bains).map(h => h.suburb))].sort();
  $("#f-area").innerHTML = `<option value="all">All areas</option><option value="bains">Bains</option>${areas.map(a => `<option>${esc(a)}</option>`).join("")}`;
  $("#f-max").innerHTML = [[0, "Any price"], [6500], [7000], [7500], [8000], [8500], [9000], [10000]].map(([v, t]) => `<option value="${v}">${t || R(v)}</option>`).join("");
  if (!["all", "bains", ...areas].includes(S.f.area)) S.f.area = "all";
  const ids = S.homes.map(h => h.id), seen = store.get("seen", null);
  if (seen) S.newIds = ids.filter(id => !seen.includes(id));
  store.set("seen", ids);
  syncControls(); route();
}).catch(() => { $("#main").innerHTML = `<div class="empty" style="margin-top:24px"><b>The homes didn't load.</b><p>Check your connection, then refresh the page.</p></div>`; });
})();
</script>
</body>
</html>
